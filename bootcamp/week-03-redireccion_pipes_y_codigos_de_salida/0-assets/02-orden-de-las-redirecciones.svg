<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>El orden de las redirecciones: &gt; todo.log 2&gt;&amp;1 frente a 2&gt;&amp;1 &gt; todo.log</title>
  <rect width="900" height="480" fill="#0d1117"/>
  <text x="450" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">bash aplica las redirecciones de izquierda a derecha</text>
  <text x="285" y="80" fill="#f78166" font-size="17" font-weight="600" text-anchor="middle">comando &gt; todo.log 2&gt;&amp;1</text>
  <text x="685" y="80" fill="#f78166" font-size="17" font-weight="600" text-anchor="middle">comando 2&gt;&amp;1 &gt; todo.log</text>
  <text x="24" y="142" fill="#8b949e" font-size="13">al empezar</text>
  <text x="24" y="267" fill="#8b949e" font-size="13">paso 1</text>
  <text x="24" y="369" fill="#8b949e" font-size="13">paso 2</text>
  <text x="285" y="215" fill="#d2a8ff" font-size="14" text-anchor="middle">&gt; todo.log mueve el 1</text>
  <text x="285" y="317" fill="#d2a8ff" font-size="14" text-anchor="middle">2&gt;&amp;1 copia el 1: ya es el archivo</text>
  <text x="685" y="215" fill="#d2a8ff" font-size="14" text-anchor="middle">2&gt;&amp;1 copia el 1: aún es la terminal</text>
  <text x="685" y="317" fill="#d2a8ff" font-size="14" text-anchor="middle">&gt; todo.log mueve solo el 1</text>
  <rect x="120" y="100" width="330" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="140" y="130" fill="#79c0ff" font-size="15">1 stdout</text>
  <text x="230" y="130" fill="#8b949e" font-size="15">→</text>
  <text x="260" y="130" fill="#f0f6fc" font-size="15">terminal</text>
  <text x="140" y="156" fill="#f85149" font-size="15">2 stderr</text>
  <text x="230" y="156" fill="#8b949e" font-size="15">→</text>
  <text x="260" y="156" fill="#f0f6fc" font-size="15">terminal</text>
  <rect x="520" y="100" width="330" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="540" y="130" fill="#79c0ff" font-size="15">1 stdout</text>
  <text x="630" y="130" fill="#8b949e" font-size="15">→</text>
  <text x="660" y="130" fill="#f0f6fc" font-size="15">terminal</text>
  <text x="540" y="156" fill="#f85149" font-size="15">2 stderr</text>
  <text x="630" y="156" fill="#8b949e" font-size="15">→</text>
  <text x="660" y="156" fill="#f0f6fc" font-size="15">terminal</text>
  <rect x="120" y="225" width="330" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="140" y="255" fill="#79c0ff" font-size="15">1 stdout</text>
  <text x="230" y="255" fill="#8b949e" font-size="15">→</text>
  <text x="260" y="255" fill="#3fb950" font-size="15">todo.log</text>
  <text x="140" y="281" fill="#f85149" font-size="15">2 stderr</text>
  <text x="230" y="281" fill="#8b949e" font-size="15">→</text>
  <text x="260" y="281" fill="#f0f6fc" font-size="15">terminal</text>
  <rect x="520" y="225" width="330" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="540" y="255" fill="#79c0ff" font-size="15">1 stdout</text>
  <text x="630" y="255" fill="#8b949e" font-size="15">→</text>
  <text x="660" y="255" fill="#f0f6fc" font-size="15">terminal</text>
  <text x="540" y="281" fill="#f85149" font-size="15">2 stderr</text>
  <text x="630" y="281" fill="#8b949e" font-size="15">→</text>
  <text x="660" y="281" fill="#f0f6fc" font-size="15">terminal</text>
  <rect x="120" y="327" width="330" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="140" y="357" fill="#79c0ff" font-size="15">1 stdout</text>
  <text x="230" y="357" fill="#8b949e" font-size="15">→</text>
  <text x="260" y="357" fill="#3fb950" font-size="15">todo.log</text>
  <text x="140" y="383" fill="#f85149" font-size="15">2 stderr</text>
  <text x="230" y="383" fill="#8b949e" font-size="15">→</text>
  <text x="260" y="383" fill="#3fb950" font-size="15">todo.log</text>
  <rect x="520" y="327" width="330" height="74" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="540" y="357" fill="#79c0ff" font-size="15">1 stdout</text>
  <text x="630" y="357" fill="#8b949e" font-size="15">→</text>
  <text x="660" y="357" fill="#3fb950" font-size="15">todo.log</text>
  <text x="540" y="383" fill="#f85149" font-size="15">2 stderr</text>
  <text x="630" y="383" fill="#8b949e" font-size="15">→</text>
  <text x="660" y="383" fill="#e3b341" font-size="15">terminal</text>
  <text x="285" y="440" fill="#3fb950" font-size="16" font-weight="600" text-anchor="middle">los dos al log</text>
  <text x="685" y="440" fill="#e3b341" font-size="16" font-weight="600" text-anchor="middle">los errores siguen en pantalla</text>
</svg>
