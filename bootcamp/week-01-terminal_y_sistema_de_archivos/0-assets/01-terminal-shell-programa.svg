<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Capas de la terminal: tú, la terminal, bash, el programa y el kernel</title>
  <rect width="900" height="380" fill="#0d1117"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <text x="450" y="38" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Qué pasa cuando escribes ls docs y pulsas Enter</text>

  <rect x="30" y="80" width="140" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="100" y="115" fill="#f0f6fc" font-size="18" font-weight="600" text-anchor="middle">Tú</text>
  <text x="100" y="145" fill="#8b949e" font-size="14" text-anchor="middle">teclado</text>
  <text x="100" y="168" fill="#8b949e" font-size="14" text-anchor="middle">y pantalla</text>

  <rect x="210" y="80" width="160" height="150" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="290" y="115" fill="#79c0ff" font-size="18" font-weight="600" text-anchor="middle">Terminal</text>
  <text x="290" y="145" fill="#8b949e" font-size="14" text-anchor="middle">la ventana: recoge</text>
  <text x="290" y="168" fill="#8b949e" font-size="14" text-anchor="middle">teclas, pinta texto</text>
  <text x="290" y="200" fill="#8b949e" font-size="14" text-anchor="middle">no entiende comandos</text>

  <rect x="410" y="80" width="190" height="150" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
  <text x="505" y="115" fill="#3fb950" font-size="18" font-weight="600" text-anchor="middle">bash (la shell)</text>
  <text x="505" y="145" fill="#8b949e" font-size="14" text-anchor="middle">lee la línea, la parte</text>
  <text x="505" y="168" fill="#8b949e" font-size="14" text-anchor="middle">por los espacios y lanza</text>
  <text x="505" y="191" fill="#8b949e" font-size="14" text-anchor="middle">el programa</text>
  <text x="505" y="216" fill="#f78166" font-size="14" text-anchor="middle">palabras: ls · docs</text>

  <rect x="640" y="80" width="230" height="150" rx="10" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="755" y="115" fill="#f78166" font-size="18" font-weight="600" text-anchor="middle">Programa: ls</text>
  <text x="755" y="145" fill="#8b949e" font-size="14" text-anchor="middle">/usr/bin/ls hace su tarea</text>
  <text x="755" y="168" fill="#8b949e" font-size="14" text-anchor="middle">con el argumento docs</text>
  <text x="755" y="191" fill="#8b949e" font-size="14" text-anchor="middle">y termina</text>

  <line x1="170" y1="130" x2="206" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="130" x2="406" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="130" x2="636" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="640" y="270" width="230" height="60" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="755" y="297" fill="#d2a8ff" font-size="16" font-weight="600" text-anchor="middle">Kernel</text>
  <text x="755" y="318" fill="#8b949e" font-size="13" text-anchor="middle">lee el disco por el programa</text>
  <line x1="755" y1="230" x2="755" y2="266" stroke="#d2a8ff" stroke-width="2" marker-end="url(#a)"/>

  <path d="M640 300 H100 V234" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
  <text x="370" y="290" fill="#8b949e" font-size="14" text-anchor="middle">la salida (los nombres de docs) vuelve a la terminal</text>
  <text x="370" y="355" fill="#8b949e" font-size="14" text-anchor="middle">si el programa no existe, bash responde command not found; si docs no existe, responde ls</text>
</svg>
