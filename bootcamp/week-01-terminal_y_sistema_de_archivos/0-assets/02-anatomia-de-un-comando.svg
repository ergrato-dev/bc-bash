<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Anatomía de un comando: ls -l -a /etc</title>
  <rect width="900" height="330" fill="#0d1117"/>
  <text x="450" y="38" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Anatomía de un comando</text>

  <rect x="130" y="70" width="640" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="230" y="122" fill="#3fb950" font-size="34" font-weight="600" text-anchor="middle">ls</text>
  <text x="365" y="122" fill="#f78166" font-size="34" font-weight="600" text-anchor="middle">-l</text>
  <text x="475" y="122" fill="#f78166" font-size="34" font-weight="600" text-anchor="middle">-a</text>
  <text x="630" y="122" fill="#79c0ff" font-size="34" font-weight="600" text-anchor="middle">/etc</text>

  <text x="297" y="168" fill="#8b949e" font-size="13" text-anchor="middle">espacio</text>
  <text x="420" y="168" fill="#8b949e" font-size="13" text-anchor="middle">espacio</text>
  <text x="540" y="168" fill="#8b949e" font-size="13" text-anchor="middle">espacio</text>

  <line x1="230" y1="180" x2="230" y2="215" stroke="#3fb950" stroke-width="2"/>
  <line x1="365" y1="180" x2="420" y2="215" stroke="#f78166" stroke-width="2"/>
  <line x1="475" y1="180" x2="420" y2="215" stroke="#f78166" stroke-width="2"/>
  <line x1="630" y1="180" x2="630" y2="215" stroke="#79c0ff" stroke-width="2"/>

  <rect x="120" y="220" width="220" height="90" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="230" y="250" fill="#3fb950" font-size="17" font-weight="600" text-anchor="middle">comando</text>
  <text x="230" y="274" fill="#8b949e" font-size="14" text-anchor="middle">qué programa se ejecuta</text>
  <text x="230" y="296" fill="#8b949e" font-size="14" text-anchor="middle">siempre va primero</text>

  <rect x="350" y="220" width="140" height="90" rx="10" fill="#161b22" stroke="#f78166" stroke-width="2"/>
  <text x="420" y="250" fill="#f78166" font-size="17" font-weight="600" text-anchor="middle">opciones</text>
  <text x="420" y="274" fill="#8b949e" font-size="14" text-anchor="middle">cambian cómo</text>
  <text x="420" y="296" fill="#8b949e" font-size="14" text-anchor="middle">igual que -la</text>

  <rect x="500" y="220" width="260" height="90" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="630" y="250" fill="#79c0ff" font-size="17" font-weight="600" text-anchor="middle">argumento</text>
  <text x="630" y="274" fill="#8b949e" font-size="14" text-anchor="middle">sobre qué trabaja: una ruta,</text>
  <text x="630" y="296" fill="#8b949e" font-size="14" text-anchor="middle">un archivo, un texto</text>
</svg>
