<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Cómo busca bash un comando: recorre las carpetas del PATH en orden y ejecuta el primero que encuentra</title>
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="38" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Cómo encuentra bash un comando: el PATH, de izquierda a derecha</text>

  <!-- fila 1: PATH original -->
  <text x="40" y="88" fill="#8b949e" font-size="15">backup-name con el PATH del laboratorio</text>
  <rect x="40" y="100" width="125" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="102" y="125" fill="#f0f6fc" font-size="13" text-anchor="middle">/usr/local/sbin</text>
  <text x="102" y="146" fill="#f85149" font-size="14" text-anchor="middle">no está</text>
  <rect x="180" y="100" width="125" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="242" y="125" fill="#f0f6fc" font-size="13" text-anchor="middle">/usr/local/bin</text>
  <text x="242" y="146" fill="#f85149" font-size="14" text-anchor="middle">no está</text>
  <rect x="320" y="100" width="125" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="382" y="125" fill="#f0f6fc" font-size="13" text-anchor="middle">/usr/sbin</text>
  <text x="382" y="146" fill="#f85149" font-size="14" text-anchor="middle">no está</text>
  <rect x="460" y="100" width="125" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="522" y="125" fill="#f0f6fc" font-size="13" text-anchor="middle">/usr/bin</text>
  <text x="522" y="146" fill="#f85149" font-size="14" text-anchor="middle">no está</text>
  <rect x="600" y="100" width="80" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="640" y="125" fill="#f0f6fc" font-size="13" text-anchor="middle">/sbin · /bin</text>
  <text x="640" y="146" fill="#f85149" font-size="14" text-anchor="middle">no</text>
  <line x1="690" y1="128" x2="715" y2="128" stroke="#f85149" stroke-width="2"/>
  <polygon points="715,122 725,128 715,134" fill="#f85149"/>
  <text x="730" y="124" fill="#f85149" font-size="14">command</text>
  <text x="730" y="142" fill="#f85149" font-size="14">not found</text>

  <!-- fila 2: PATH con tools delante -->
  <text x="40" y="208" fill="#8b949e" font-size="15">Tras</text>
  <text x="76" y="208" fill="#f78166" font-size="15">PATH="$PWD/starter/tools:$PATH"</text>
  <rect x="40" y="220" width="200" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="140" y="245" fill="#f0f6fc" font-size="13" text-anchor="middle">…/lab-07-…/starter/tools</text>
  <text x="140" y="266" fill="#3fb950" font-size="14" font-weight="600" text-anchor="middle">¡aquí está! lo ejecuta</text>
  <rect x="255" y="220" width="125" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="317" y="253" fill="#8b949e" font-size="13" text-anchor="middle">/usr/local/sbin</text>
  <rect x="395" y="220" width="125" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="457" y="253" fill="#8b949e" font-size="13" text-anchor="middle">/usr/local/bin</text>
  <rect x="535" y="220" width="190" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="630" y="253" fill="#8b949e" font-size="13" text-anchor="middle">… ya no mira el resto</text>

  <rect x="40" y="310" width="820" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="337" fill="#f0f6fc" font-size="15" text-anchor="middle">Gana la primera carpeta que lo tenga: por eso tus carpetas van al principio.</text>
  <text x="450" y="361" fill="#8b949e" font-size="15" text-anchor="middle">Con una / en el nombre (./backup-name, bin/bk-info), bash no mira el PATH.</text>
</svg>
