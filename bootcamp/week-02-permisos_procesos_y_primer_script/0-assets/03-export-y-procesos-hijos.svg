<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>export: el proceso hijo recibe una copia de las variables exportadas y nada vuelve al padre</title>
  <rect width="900" height="400" fill="#0d1117"/>
  <text x="450" y="38" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Un hijo recibe una copia del entorno, nunca al revés</text>

  <!-- padre -->
  <rect x="50" y="70" width="330" height="250" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="215" y="102" fill="#3fb950" font-size="19" font-weight="600" text-anchor="middle">bash (tu shell)</text>
  <text x="75" y="145" fill="#8b949e" font-size="14">variable de la shell</text>
  <text x="75" y="170" fill="#f0f6fc" font-size="17">color=verde</text>
  <text x="75" y="215" fill="#8b949e" font-size="14">variable de entorno</text>
  <text x="75" y="240" fill="#79c0ff" font-size="17">BK_ENTORNO=local</text>
  <text x="75" y="262" fill="#f78166" font-size="14">export BK_ENTORNO</text>
  <text x="75" y="300" fill="#8b949e" font-size="14">ultimo_script: (vacía)</text>

  <!-- hijo -->
  <rect x="520" y="70" width="330" height="250" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="685" y="102" fill="#58a6ff" font-size="19" font-weight="600" text-anchor="middle">bash env-check.sh</text>
  <text x="545" y="145" fill="#8b949e" font-size="14">no le llega</text>
  <text x="545" y="170" fill="#f85149" font-size="17">color: (vacía)</text>
  <text x="545" y="215" fill="#8b949e" font-size="14">copia heredada</text>
  <text x="545" y="240" fill="#79c0ff" font-size="17">BK_ENTORNO=local</text>
  <text x="545" y="280" fill="#8b949e" font-size="14">creada en el hijo</text>
  <text x="545" y="302" fill="#d2a8ff" font-size="17">ultimo_script=env-check.sh</text>

  <!-- copia -->
  <line x1="380" y1="235" x2="510" y2="235" stroke="#79c0ff" stroke-width="2"/>
  <polygon points="510,229 520,235 510,241" fill="#79c0ff"/>
  <text x="450" y="225" fill="#79c0ff" font-size="14" text-anchor="middle">copia</text>

  <line x1="380" y1="165" x2="510" y2="165" stroke="#f85149" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="450" y="155" fill="#f85149" font-size="14" text-anchor="middle">sin export</text>

  <!-- vuelta -->
  <line x1="520" y1="296" x2="390" y2="296" stroke="#f85149" stroke-width="2" stroke-dasharray="6 6"/>
  <polygon points="390,290 380,296 390,302" fill="#f85149"/>
  <text x="450" y="286" fill="#f85149" font-size="14" text-anchor="middle">nunca vuelve</text>

  <text x="450" y="362" fill="#8b949e" font-size="15" text-anchor="middle">Al terminar el script, su proceso desaparece con todas sus variables.</text>
  <text x="380" y="384" fill="#8b949e" font-size="15" text-anchor="end">Solo para un comando:</text>
  <text x="390" y="384" fill="#f78166" font-size="15">BK_ENTORNO=pruebas bash env-check.sh</text>
</svg>
