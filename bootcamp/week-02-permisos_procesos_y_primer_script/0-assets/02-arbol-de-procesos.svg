<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Árbol de procesos: bash con PID 1 y sus hijos sleep y ps, y las señales que reciben</title>
  <rect width="900" height="430" fill="#0d1117"/>
  <text x="450" y="38" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Cada comando es un proceso hijo de tu bash</text>

  <!-- padre -->
  <rect x="330" y="65" width="240" height="80" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="98" fill="#3fb950" font-size="20" font-weight="600" text-anchor="middle">bash</text>
  <text x="450" y="124" fill="#8b949e" font-size="14" text-anchor="middle">PID 1 · tu shell · $$</text>

  <line x1="390" y1="145" x2="230" y2="200" stroke="#30363d" stroke-width="2"/>
  <line x1="510" y1="145" x2="670" y2="200" stroke="#30363d" stroke-width="2"/>
  <text x="270" y="172" fill="#8b949e" font-size="13" text-anchor="middle">PPID 1</text>
  <text x="630" y="172" fill="#8b949e" font-size="13" text-anchor="middle">PPID 1</text>

  <!-- hijo segundo plano -->
  <rect x="90" y="200" width="280" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="230" y="232" fill="#f78166" font-size="19" font-weight="600" text-anchor="middle">sleep 300 &amp;</text>
  <text x="230" y="256" fill="#8b949e" font-size="14" text-anchor="middle">PID 15 · trabajo [1]</text>
  <text x="230" y="277" fill="#58a6ff" font-size="14" text-anchor="middle">segundo plano: tienes el prompt</text>

  <!-- hijo primer plano -->
  <rect x="530" y="200" width="280" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="670" y="232" fill="#f78166" font-size="19" font-weight="600" text-anchor="middle">ps</text>
  <text x="670" y="256" fill="#8b949e" font-size="14" text-anchor="middle">PID 16</text>
  <text x="670" y="277" fill="#58a6ff" font-size="14" text-anchor="middle">primer plano: bash espera</text>

  <!-- señales -->
  <line x1="150" y1="345" x2="150" y2="296" stroke="#f85149" stroke-width="2"/>
  <polygon points="144,302 156,302 150,292" fill="#f85149"/>
  <text x="150" y="366" fill="#f78166" font-size="16" font-weight="600" text-anchor="middle">kill 15</text>
  <text x="150" y="388" fill="#8b949e" font-size="14" text-anchor="middle">SIGTERM: termina, por favor</text>

  <line x1="310" y1="345" x2="310" y2="296" stroke="#f85149" stroke-width="2"/>
  <polygon points="304,302 316,302 310,292" fill="#f85149"/>
  <text x="310" y="366" fill="#f78166" font-size="16" font-weight="600" text-anchor="middle">kill -9 15</text>
  <text x="310" y="388" fill="#8b949e" font-size="14" text-anchor="middle">SIGKILL: sin aviso</text>

  <line x1="670" y1="345" x2="670" y2="296" stroke="#f85149" stroke-width="2"/>
  <polygon points="664,302 676,302 670,292" fill="#f85149"/>
  <text x="670" y="366" fill="#f78166" font-size="16" font-weight="600" text-anchor="middle">Ctrl+C</text>
  <text x="670" y="388" fill="#8b949e" font-size="14" text-anchor="middle">SIGINT: solo al de primer plano</text>

  <text x="450" y="418" fill="#e3b341" font-size="13" text-anchor="middle">Si el padre termina antes que el hijo, el hijo sigue vivo: lo adopta el proceso 1</text>
</svg>
