<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>getopts recorre los argumentos de bk-run -q -l deploy.log ls -l una opción por vuelta: la primera lee q y OPTIND pasa a 2, la segunda lee l con OPTARG deploy.log y OPTIND pasa a 4, la tercera para en ls porque no empieza por un guion; shift $((OPTIND - 1)) quita tres argumentos y en $@ quedan ls -l</title>
  <rect width="1000" height="500" fill="#0d1117"/>
  <text x="500" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle"><tspan fill="#f78166">while getopts ":ql:h" opt</tspan> con <tspan fill="#f78166">bk-run -q -l deploy.log ls -l</tspan></text>

  <text x="150" y="80" fill="#8b949e" font-size="13" text-anchor="middle">posición</text>
  <text x="275" y="80" fill="#d2a8ff" font-size="14" text-anchor="middle">1</text>
  <text x="400" y="80" fill="#d2a8ff" font-size="14" text-anchor="middle">2</text>
  <text x="550" y="80" fill="#d2a8ff" font-size="14" text-anchor="middle">3</text>
  <text x="700" y="80" fill="#d2a8ff" font-size="14" text-anchor="middle">4</text>
  <text x="825" y="80" fill="#d2a8ff" font-size="14" text-anchor="middle">5</text>
  <rect x="215" y="90" width="120" height="46" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="275" y="119" fill="#f0f6fc" font-size="16" text-anchor="middle">-q</text>
  <rect x="340" y="90" width="120" height="46" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="119" fill="#f0f6fc" font-size="16" text-anchor="middle">-l</text>
  <rect x="465" y="90" width="170" height="46" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="550" y="119" fill="#f0f6fc" font-size="16" text-anchor="middle">deploy.log</text>
  <rect x="640" y="90" width="120" height="46" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="700" y="119" fill="#79c0ff" font-size="16" text-anchor="middle">ls</text>
  <rect x="765" y="90" width="120" height="46" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="825" y="119" fill="#79c0ff" font-size="16" text-anchor="middle">-l</text>
  <text x="150" y="119" fill="#8b949e" font-size="13" text-anchor="middle">argumentos</text>

  <text x="40" y="190" fill="#f0f6fc" font-size="15" font-weight="600">vuelta 1</text>
  <text x="140" y="190" fill="#f0f6fc" font-size="15">opt=<tspan fill="#3fb950">q</tspan></text>
  <text x="400" y="190" fill="#d2a8ff" font-size="15" text-anchor="middle">▲ OPTIND=2</text>

  <text x="40" y="240" fill="#f0f6fc" font-size="15" font-weight="600">vuelta 2</text>
  <text x="140" y="240" fill="#f0f6fc" font-size="15">opt=<tspan fill="#3fb950">l</tspan>  OPTARG=<tspan fill="#3fb950">deploy.log</tspan></text>
  <text x="700" y="240" fill="#d2a8ff" font-size="15" text-anchor="middle">▲ OPTIND=4</text>

  <text x="40" y="290" fill="#f0f6fc" font-size="15" font-weight="600">vuelta 3</text>
  <text x="140" y="290" fill="#e3b341" font-size="15">"ls" no empieza por "-": getopts sale con 1 y el while termina</text>

  <rect x="40" y="330" width="920" height="1" fill="#30363d"/>
  <text x="40" y="372" fill="#f78166" font-size="16">shift $((OPTIND - 1))</text>
  <text x="250" y="372" fill="#8b949e" font-size="15">quita 3 argumentos: los que ya leyó getopts</text>

  <rect x="215" y="400" width="120" height="46" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="275" y="429" fill="#79c0ff" font-size="16" text-anchor="middle">ls</text>
  <rect x="340" y="400" width="120" height="46" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="400" y="429" fill="#79c0ff" font-size="16" text-anchor="middle">-l</text>
  <text x="150" y="429" fill="#8b949e" font-size="13" text-anchor="middle">"$@"</text>
  <text x="490" y="429" fill="#8b949e" font-size="15">el comando, con su -l: bk-run no la toca</text>
</svg>
