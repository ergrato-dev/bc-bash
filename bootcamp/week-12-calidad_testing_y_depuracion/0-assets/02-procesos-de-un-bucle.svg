<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>El mismo bucle sobre 2000 archivos, de dos maneras. Con basename, echo y sed, cada vuelta crea tres procesos: 6000 en total y 8 segundos. Con las expansiones de bash no crea ninguno y tarda 0,02 segundos</title>
  <rect width="1000" height="420" fill="#0d1117"/>
  <text x="500" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Una vuelta del bucle, 2000 veces</text>

  <rect x="30" y="70" width="450" height="320" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="255" y="102" fill="#f0f6fc" font-size="16" font-weight="600" text-anchor="middle">Con comandos de fuera</text>
  <text x="255" y="130" fill="#f78166" font-size="13" text-anchor="middle">name=$(basename "$path")</text>
  <text x="255" y="152" fill="#f78166" font-size="13" text-anchor="middle">ext=$(echo "$name" | sed 's/.*\.//')</text>

  <rect x="195" y="175" width="120" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="255" y="200" fill="#3fb950" font-size="14" text-anchor="middle">bash</text>
  <line x1="215" y1="215" x2="110" y2="255" stroke="#8b949e" stroke-width="2"/>
  <line x1="255" y1="215" x2="255" y2="255" stroke="#8b949e" stroke-width="2"/>
  <line x1="295" y1="215" x2="400" y2="255" stroke="#8b949e" stroke-width="2"/>
  <rect x="50" y="255" width="120" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="110" y="280" fill="#f78166" font-size="14" text-anchor="middle">basename</text>
  <rect x="195" y="255" width="120" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="255" y="280" fill="#f78166" font-size="14" text-anchor="middle">echo</text>
  <rect x="340" y="255" width="120" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
  <text x="400" y="280" fill="#f78166" font-size="14" text-anchor="middle">sed</text>
  <text x="255" y="330" fill="#f85149" font-size="15" font-weight="600" text-anchor="middle">3 procesos por vuelta: 6000</text>
  <text x="255" y="360" fill="#f0f6fc" font-size="15" text-anchor="middle">real 8,2 s</text>

  <rect x="520" y="70" width="450" height="320" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="745" y="102" fill="#f0f6fc" font-size="16" font-weight="600" text-anchor="middle">Con expansiones de bash</text>
  <text x="745" y="130" fill="#79c0ff" font-size="13" text-anchor="middle">name="${path##*/}"</text>
  <text x="745" y="152" fill="#79c0ff" font-size="13" text-anchor="middle">ext="${name##*.}"</text>

  <rect x="685" y="175" width="120" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="745" y="200" fill="#3fb950" font-size="14" text-anchor="middle">bash</text>
  <text x="745" y="275" fill="#8b949e" font-size="14" text-anchor="middle">todo dentro de bash: ningún proceso</text>
  <text x="745" y="330" fill="#3fb950" font-size="15" font-weight="600" text-anchor="middle">0 procesos</text>
  <text x="745" y="360" fill="#f0f6fc" font-size="15" text-anchor="middle">real 0,02 s</text>
</svg>
