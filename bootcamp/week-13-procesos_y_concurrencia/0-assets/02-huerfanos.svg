<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Un script con pid 15 y tres workers en el grupo de procesos 15. Con kill 15, la señal solo llega al script: los workers siguen vivos y los adopta el proceso 1. Con kill %1, la señal va al grupo entero y mueren todos</title>
  <rect width="1000" height="460" fill="#0d1117"/>
  <text x="500" y="34" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">A quién le llega la señal</text>

  <rect x="30" y="60" width="450" height="370" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="255" y="92" fill="#f78166" font-size="16" font-weight="600" text-anchor="middle">kill 15</text>
  <text x="255" y="114" fill="#8b949e" font-size="13" text-anchor="middle">al proceso 15, el script</text>
  <rect x="185" y="135" width="140" height="44" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="255" y="162" fill="#f85149" font-size="14" text-anchor="middle">15 workers.sh</text>
  <text x="340" y="162" fill="#f85149" font-size="13">muere</text>
  <rect x="60" y="215" width="120" height="40" rx="6" fill="#0d1117" stroke="#d2a8ff" stroke-width="2"/>
  <text x="120" y="240" fill="#d2a8ff" font-size="14" text-anchor="middle">1 (init)</text>
  <line x1="180" y1="235" x2="205" y2="300" stroke="#d2a8ff" stroke-width="2"/>
  <line x1="180" y1="235" x2="305" y2="300" stroke="#d2a8ff" stroke-width="2"/>
  <line x1="180" y1="235" x2="405" y2="300" stroke="#d2a8ff" stroke-width="2"/>
  <g font-size="14" text-anchor="middle">
    <rect x="160" y="300" width="90" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <rect x="260" y="300" width="90" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <rect x="360" y="300" width="90" height="40" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="205" y="325" fill="#3fb950">18 worker</text>
    <text x="305" y="325" fill="#3fb950">19 worker</text>
    <text x="405" y="325" fill="#3fb950">20 worker</text>
  </g>
  <text x="255" y="375" fill="#e3b341" font-size="14" text-anchor="middle">siguen vivos: huérfanos, ahora con PPID 1</text>
  <text x="255" y="400" fill="#8b949e" font-size="13" text-anchor="middle">así la manda un kill desde otra terminal o un script</text>

  <rect x="520" y="60" width="450" height="370" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="745" y="92" fill="#f78166" font-size="16" font-weight="600" text-anchor="middle">kill %1  (o Ctrl-C)</text>
  <text x="745" y="114" fill="#8b949e" font-size="13" text-anchor="middle">al grupo de procesos 15 entero</text>
  <rect x="545" y="125" width="400" height="230" rx="10" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="560" y="345" fill="#f85149" font-size="13">grupo 15</text>
  <rect x="675" y="145" width="140" height="44" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="745" y="172" fill="#f85149" font-size="14" text-anchor="middle">15 workers.sh</text>
  <line x1="705" y1="189" x2="645" y2="260" stroke="#8b949e" stroke-width="2"/>
  <line x1="745" y1="189" x2="745" y2="260" stroke="#8b949e" stroke-width="2"/>
  <line x1="785" y1="189" x2="845" y2="260" stroke="#8b949e" stroke-width="2"/>
  <g font-size="14" text-anchor="middle" fill="#f85149">
    <rect x="600" y="260" width="90" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="700" y="260" width="90" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="800" y="260" width="90" height="40" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="645" y="285">18 worker</text>
    <text x="745" y="285">19 worker</text>
    <text x="845" y="285">20 worker</text>
  </g>
  <text x="745" y="385" fill="#f0f6fc" font-size="14" text-anchor="middle">mueren todos, sin que el script decida nada</text>
  <text x="745" y="410" fill="#8b949e" font-size="13" text-anchor="middle">el arreglo: un trap que manda TERM a jobs -p</text>
</svg>
