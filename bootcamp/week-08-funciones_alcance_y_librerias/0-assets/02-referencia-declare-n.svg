<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Con local -n out_host=host, la función no tiene una variable propia: out_host es otro nombre para la variable host de quien la llama, y escribir en out_host cambia host. Lo mismo con out_port y port</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1000" height="420" fill="#0d1117"/>
  <text x="500" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">split_target "db-01:5432" host port</text>

  <!-- quien llama -->
  <rect x="40" y="70" width="400" height="290" rx="10" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="60" y="98" fill="#3fb950" font-size="15" font-weight="600">el script (quien llama)</text>
  <rect x="80" y="130" width="320" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="100" y="160" fill="#f0f6fc" font-size="15">host</text>
  <text x="100" y="185" fill="#79c0ff" font-size="14">antes vacía, después db-01</text>
  <rect x="80" y="240" width="320" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="100" y="270" fill="#f0f6fc" font-size="15">port</text>
  <text x="100" y="295" fill="#79c0ff" font-size="14">antes vacía, después 5432</text>

  <!-- función -->
  <rect x="560" y="70" width="400" height="290" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="580" y="98" fill="#d2a8ff" font-size="15" font-weight="600">split_target</text>
  <text x="580" y="124" fill="#f78166" font-size="14">local -n out_host=$2 out_port=$3</text>
  <text x="580" y="170" fill="#f0f6fc" font-size="15">out_host=db-01</text>
  <text x="580" y="280" fill="#f0f6fc" font-size="15">out_port=5432</text>
  <text x="580" y="330" fill="#8b949e" font-size="13">no guardan nada: son otros nombres</text>

  <line x1="570" y1="165" x2="405" y2="165" stroke="#d2a8ff" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="488" y="155" fill="#d2a8ff" font-size="13" text-anchor="middle">escribe en</text>
  <line x1="570" y1="275" x2="405" y2="275" stroke="#d2a8ff" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="488" y="265" fill="#d2a8ff" font-size="13" text-anchor="middle">escribe en</text>

  <text x="500" y="398" fill="#e3b341" font-size="14" text-anchor="middle">Si quien llama pasa el nombre out_host, la referencia apunta a sí misma: circular name reference</text>
</svg>
