<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>bashkit clean 7 logs: bashkit carga lib/core.sh, quita clean de los argumentos con shift, valida el nombre y hace exec de bin/bk-clean con 7 logs. bk-clean también carga lib/core.sh, y su código de salida es el que ve quien llamó a bashkit</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="#0d1117"/>
  <text x="500" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Un dispatcher: un nombre, y el script que le toca</text>

  <rect x="40" y="130" width="250" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="165" y="158" fill="#8b949e" font-size="13" text-anchor="middle">la terminal</text>
  <text x="165" y="184" fill="#f78166" font-size="16" text-anchor="middle">bashkit clean 7 logs</text>

  <line x1="290" y1="165" x2="368" y2="165" stroke="#58a6ff" stroke-width="2" marker-end="url(#flecha)"/>

  <rect x="370" y="120" width="290" height="200" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="390" y="148" fill="#3fb950" font-size="16" font-weight="600">bin/bashkit</text>
  <text x="390" y="178" fill="#f0f6fc" font-size="14">1. source lib/core.sh</text>
  <text x="390" y="206" fill="#f0f6fc" font-size="14">2. sub=clean; shift</text>
  <text x="390" y="234" fill="#f0f6fc" font-size="14">3. ¿^[a-z][a-z-]*$? ¿existe bk-clean?</text>
  <text x="390" y="262" fill="#f0f6fc" font-size="14">4. exec bin/bk-clean "$@"</text>
  <text x="390" y="294" fill="#8b949e" font-size="13">"$@" ya es solo: 7 logs</text>

  <line x1="660" y1="255" x2="738" y2="255" stroke="#58a6ff" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="699" y="245" fill="#79c0ff" font-size="13" text-anchor="middle">exec</text>

  <rect x="740" y="200" width="220" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="760" y="228" fill="#3fb950" font-size="16" font-weight="600">bin/bk-clean</text>
  <text x="760" y="258" fill="#f0f6fc" font-size="14">$1=7  $2=logs</text>
  <text x="760" y="286" fill="#f0f6fc" font-size="14">source lib/core.sh</text>

  <rect x="370" y="390" width="590" height="70" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
  <text x="390" y="418" fill="#d2a8ff" font-size="15" font-weight="600">lib/core.sh</text>
  <text x="390" y="444" fill="#f0f6fc" font-size="14">log, die, require: los dos la cargan, nadie la ejecuta</text>
  <line x1="450" y1="320" x2="450" y2="388" stroke="#d2a8ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <line x1="850" y1="320" x2="850" y2="388" stroke="#d2a8ff" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#flecha)"/>

  <path d="M 800 200 C 800 60, 165 60, 165 128" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flecha)"/>
  <text x="560" y="74" fill="#e3b341" font-size="13" text-anchor="middle">el código de salida de bk-clean es el de bashkit: exec no vuelve</text>

  <text x="165" y="350" fill="#f85149" font-size="14" text-anchor="middle">bashkit ../x  o  bashkit nada:</text>
  <text x="165" y="374" fill="#f85149" font-size="14" text-anchor="middle">die con código 2, sin exec</text>
</svg>
