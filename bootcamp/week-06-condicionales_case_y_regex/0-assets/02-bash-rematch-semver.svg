<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Los grupos de la regex de semver y lo que guarda BASH_REMATCH para 2.0.0-rc.1: el 0 el texto entero, del 1 al 3 los tres números, el 4 el prerelease con guion y el 5 sin él</title>
  <rect width="1120" height="440" fill="#0d1117"/>
  <text x="560" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">[[ 2.0.0-rc.1 =~ $re ]]: cada paréntesis guarda su trozo</text>

  <text x="30" y="125" fill="#8b949e" font-size="14" font-weight="600">regex</text>
  <text x="30" y="225" fill="#8b949e" font-size="14" font-weight="600">texto</text>
  <text x="30" y="298" fill="#8b949e" font-size="14" font-weight="600">BASH_</text>
  <text x="30" y="316" fill="#8b949e" font-size="14" font-weight="600">REMATCH</text>

  <text x="135" y="126" fill="#8b949e" font-size="16" text-anchor="middle">^</text>
  <text x="245" y="88" fill="#d2a8ff" font-size="13" text-anchor="middle">grupo 1</text>
  <rect x="150" y="100" width="190" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="245" y="126" fill="#f0f6fc" font-size="15" text-anchor="middle">(0|[1-9][0-9]*)</text>
  <text x="370" y="126" fill="#f0f6fc" font-size="15" text-anchor="middle">\.</text>
  <text x="495" y="88" fill="#d2a8ff" font-size="13" text-anchor="middle">grupo 2</text>
  <rect x="400" y="100" width="190" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="495" y="126" fill="#f0f6fc" font-size="15" text-anchor="middle">(0|[1-9][0-9]*)</text>
  <text x="620" y="126" fill="#f0f6fc" font-size="15" text-anchor="middle">\.</text>
  <text x="745" y="88" fill="#d2a8ff" font-size="13" text-anchor="middle">grupo 3</text>
  <rect x="650" y="100" width="190" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="745" y="126" fill="#f0f6fc" font-size="15" text-anchor="middle">(0|[1-9][0-9]*)</text>
  <text x="960" y="72" fill="#d2a8ff" font-size="13" text-anchor="middle">grupo 4 (con el 5 dentro)</text>
  <rect x="850" y="80" width="220" height="64" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="868" y="118" fill="#f0f6fc" font-size="14">(-</text>
  <rect x="888" y="96" width="150" height="34" rx="5" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="963" y="118" fill="#f0f6fc" font-size="13" text-anchor="middle">([0-9A-Za-z.-]+)</text>
  <text x="1054" y="118" fill="#f0f6fc" font-size="14" text-anchor="middle">)?</text>
  <text x="1090" y="126" fill="#8b949e" font-size="16" text-anchor="middle">$</text>

  <line x1="245" y1="140" x2="245" y2="200" stroke="#30363d" stroke-width="2"/>
  <line x1="495" y1="140" x2="495" y2="200" stroke="#30363d" stroke-width="2"/>
  <line x1="745" y1="140" x2="745" y2="200" stroke="#30363d" stroke-width="2"/>
  <line x1="960" y1="144" x2="960" y2="200" stroke="#30363d" stroke-width="2"/>

  <rect x="150" y="200" width="190" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="245" y="226" fill="#79c0ff" font-size="17" text-anchor="middle">2</text>
  <text x="370" y="226" fill="#79c0ff" font-size="17" text-anchor="middle">.</text>
  <rect x="400" y="200" width="190" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="495" y="226" fill="#79c0ff" font-size="17" text-anchor="middle">0</text>
  <text x="620" y="226" fill="#79c0ff" font-size="17" text-anchor="middle">.</text>
  <rect x="650" y="200" width="190" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="745" y="226" fill="#79c0ff" font-size="17" text-anchor="middle">0</text>
  <rect x="850" y="200" width="220" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="878" y="226" fill="#79c0ff" font-size="17" text-anchor="middle">-</text>
  <rect x="900" y="205" width="140" height="30" rx="5" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="970" y="226" fill="#79c0ff" font-size="17" text-anchor="middle">rc.1</text>

  <text x="245" y="298" fill="#d2a8ff" font-size="15" text-anchor="middle">[1] = 2</text>
  <text x="495" y="298" fill="#d2a8ff" font-size="15" text-anchor="middle">[2] = 0</text>
  <text x="745" y="298" fill="#d2a8ff" font-size="15" text-anchor="middle">[3] = 0</text>
  <text x="960" y="292" fill="#d2a8ff" font-size="15" text-anchor="middle">[4] = -rc.1</text>
  <text x="960" y="316" fill="#d2a8ff" font-size="15" text-anchor="middle">[5] = rc.1</text>

  <line x1="150" y1="350" x2="1070" y2="350" stroke="#d2a8ff" stroke-width="2"/>
  <line x1="150" y1="342" x2="150" y2="358" stroke="#d2a8ff" stroke-width="2"/>
  <line x1="1070" y1="342" x2="1070" y2="358" stroke="#d2a8ff" stroke-width="2"/>
  <text x="610" y="380" fill="#d2a8ff" font-size="15" text-anchor="middle">[0] = 2.0.0-rc.1, el texto entero que encajó</text>
  <text x="560" y="420" fill="#8b949e" font-size="13" text-anchor="middle">Los grupos se numeran por el orden de su paréntesis de apertura. ^ y $ no son grupos: anclan al principio y al final.</text>
</svg>
