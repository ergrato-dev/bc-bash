<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>Cómo decide un if: ejecuta el comando de la condición y, si sale con 0, entra en then; con cualquier otro código pasa a elif o else; después sigue tras fi</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#0d1117"/>
  <text x="500" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">if ejecuta un comando y mira su código de salida</text>

  <text x="60" y="80" fill="#8b949e" font-size="13">1. ejecuta la condición</text>
  <rect x="60" y="90" width="300" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="210" y="126" fill="#f78166" font-size="16" text-anchor="middle">grep -q ana /etc/passwd</text>

  <line x1="360" y1="120" x2="428" y2="120" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="430" y="80" fill="#8b949e" font-size="13">2. lee el código</text>
  <rect x="430" y="90" width="170" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="515" y="117" fill="#f0f6fc" font-size="16" text-anchor="middle">código de salida</text>
  <text x="515" y="138" fill="#79c0ff" font-size="14" text-anchor="middle">$?</text>

  <line x1="600" y1="110" x2="688" y2="80" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="640" y="80" fill="#3fb950" font-size="14" font-weight="600" text-anchor="middle">0</text>
  <rect x="690" y="55" width="260" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="820" y="77" fill="#f0f6fc" font-size="15" text-anchor="middle">then: se cumple</text>
  <text x="820" y="96" fill="#8b949e" font-size="13" text-anchor="middle">ejecuta este bloque</text>

  <line x1="600" y1="130" x2="688" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="630" y="168" fill="#e3b341" font-size="14" font-weight="600" text-anchor="middle">1, 2...</text>
  <rect x="690" y="135" width="260" height="50" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="820" y="157" fill="#f0f6fc" font-size="15" text-anchor="middle">elif / else: no se cumple</text>
  <text x="820" y="176" fill="#8b949e" font-size="13" text-anchor="middle">prueba la siguiente o salta</text>

  <line x1="820" y1="185" x2="820" y2="223" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <path d="M950,80 C990,80 990,250 952,250" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="690" y="225" width="260" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="820" y="256" fill="#f0f6fc" font-size="15" text-anchor="middle">fi: el script sigue</text>

  <line x1="40" y1="310" x2="960" y2="310" stroke="#30363d"/>
  <text x="60" y="345" fill="#8b949e" font-size="13">condición</text>
  <text x="560" y="345" fill="#8b949e" font-size="13">sale con</text>
  <text x="720" y="345" fill="#8b949e" font-size="13">rama</text>

  <text x="60" y="380" fill="#f78166" font-size="16">grep -q ana /etc/passwd</text>
  <text x="560" y="380" fill="#3fb950" font-size="16" font-weight="600">0</text>
  <text x="720" y="380" fill="#f0f6fc" font-size="16">then</text>

  <text x="60" y="415" fill="#f78166" font-size="16">[[ 3 -gt 5 ]]</text>
  <text x="560" y="415" fill="#e3b341" font-size="16" font-weight="600">1</text>
  <text x="720" y="415" fill="#f0f6fc" font-size="16">else</text>

  <text x="60" y="450" fill="#f78166" font-size="16">! command -v terraform</text>
  <text x="560" y="450" fill="#3fb950" font-size="16" font-weight="600">0</text>
  <text x="720" y="450" fill="#f0f6fc" font-size="16">then: ! invierte el 1</text>

  <text x="500" y="485" fill="#8b949e" font-size="13" text-anchor="middle">[[ ]] también es un comando: no imprime nada, solo responde con 0 o 1</text>
</svg>
