<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>jq pasa el JSON por una cadena de filtros separados por pipes: .servicios[] saca los cuatro servicios uno a uno, select deja pasar los dos que no están en marcha y .nombre escribe sus dos nombres, sin comillas con -r</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#0d1117"/>
  <text x="500" y="36" fill="#f0f6fc" font-size="19" font-weight="600" text-anchor="middle">jq -r '.servicios[] | select(.estado != "running") | .nombre' servicios.json</text>

  <rect x="20" y="70" width="190" height="230" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="100" fill="#58a6ff" font-size="15" font-weight="600" text-anchor="middle">el documento</text>
  <text x="38" y="135" fill="#f0f6fc" font-size="13">{"host": "web-01",</text>
  <text x="38" y="158" fill="#f0f6fc" font-size="13"> "servicios": [</text>
  <text x="50" y="181" fill="#8b949e" font-size="13">  {nginx ...},</text>
  <text x="50" y="204" fill="#8b949e" font-size="13">  {postgres ...},</text>
  <text x="50" y="227" fill="#8b949e" font-size="13">  {worker ...},</text>
  <text x="50" y="250" fill="#8b949e" font-size="13">  {redis ...}</text>
  <text x="38" y="273" fill="#f0f6fc" font-size="13">]}</text>

  <line x1="210" y1="185" x2="244" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="248" y="70" width="210" height="230" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="353" y="100" fill="#f78166" font-size="15" font-weight="600" text-anchor="middle">.servicios[]</text>
  <text x="353" y="122" fill="#8b949e" font-size="13" text-anchor="middle">cada elemento, por separado</text>
  <text x="266" y="160" fill="#f0f6fc" font-size="13">nginx · running</text>
  <text x="266" y="188" fill="#f0f6fc" font-size="13">postgres · running</text>
  <text x="266" y="216" fill="#f0f6fc" font-size="13">worker · exited</text>
  <text x="266" y="244" fill="#f0f6fc" font-size="13">redis · restarting</text>
  <text x="353" y="282" fill="#8b949e" font-size="13" text-anchor="middle">4 resultados</text>

  <line x1="458" y1="185" x2="496" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="500" y="70" width="276" height="230" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="638" y="100" fill="#f78166" font-size="14" font-weight="600" text-anchor="middle">select(.estado != "running")</text>
  <text x="638" y="122" fill="#8b949e" font-size="13" text-anchor="middle">deja pasar lo que cumple</text>
  <text x="522" y="160" fill="#f85149" font-size="13" text-decoration="line-through">nginx · running</text>
  <text x="522" y="188" fill="#f85149" font-size="13" text-decoration="line-through">postgres · running</text>
  <text x="522" y="216" fill="#f0f6fc" font-size="13">worker · exited</text>
  <text x="522" y="244" fill="#f0f6fc" font-size="13">redis · restarting</text>
  <text x="638" y="282" fill="#8b949e" font-size="13" text-anchor="middle">2 resultados</text>

  <line x1="776" y1="185" x2="804" y2="185" stroke="#8b949e" stroke-width="2" marker-end="url(#flecha)"/>
  <rect x="808" y="70" width="172" height="230" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="894" y="100" fill="#f78166" font-size="15" font-weight="600" text-anchor="middle">.nombre</text>
  <text x="894" y="122" fill="#8b949e" font-size="13" text-anchor="middle">con -r, sin comillas</text>
  <text x="828" y="216" fill="#f0f6fc" font-size="15">worker</text>
  <text x="828" y="244" fill="#f0f6fc" font-size="15">redis</text>
  <text x="894" y="282" fill="#8b949e" font-size="13" text-anchor="middle">stdout</text>

  <text x="500" y="345" fill="#8b949e" font-size="14" text-anchor="middle">El | de jq pasa cada resultado al filtro siguiente, como el pipe de bash pasa las líneas.</text>
</svg>
