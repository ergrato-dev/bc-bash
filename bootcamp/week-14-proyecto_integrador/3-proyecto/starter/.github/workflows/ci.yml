# CI de bashkit: en cada push y en cada pull request, GitHub ejecuta estos pasos en una
# máquina limpia. Un paso que sale con un código distinto de 0 pone el commit en rojo.
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    # Un PostgreSQL de usar y tirar para el último paso; GitHub espera a su healthcheck.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: bashkit
          POSTGRES_PASSWORD: bashkit
          POSTGRES_DB: bashkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bashkit"
          --health-interval 2s
          --health-retries 15
    # Las mismas variables que usan psql, pg_dump y pg_restore en el laboratorio.
    env:
      PGHOST: localhost
      PGUSER: bashkit
      PGPASSWORD: bashkit
      PGDATABASE: bashkit
    steps:
      - uses: actions/checkout@v7
      - name: Instalar bats y shfmt
        run: sudo apt-get update && sudo apt-get install -y bats shfmt
      - name: Lint
        run: bin/bk-lint
      - name: Tests
        run: bats tests
      # TODO(semana 14) 9: un paso que crea una tabla con 3 filas, hace una copia con
      # bin/bk-backup, borra la tabla, la restaura con bin/bk-restore -y y comprueba que
      # vuelve a tener 3 filas.
