# PostgreSQL para bashkit en tu máquina o en un servidor, desde la raíz del kit:
#   docker compose up -d --wait     # arranca y espera a que el healthcheck diga que responde
# La contraseña sale del archivo .env, junto a este, que no se sube a git:
#   POSTGRES_PASSWORD=una-contraseña-larga
services:
  db:
    # La misma versión mayor que pg_dump: un pg_dump 16 no copia un servidor 17.
    image: postgres:16
    environment:
      POSTGRES_USER: bashkit
      POSTGRES_DB: bashkit
      # :? para docker compose con un aviso si falta, en lugar de arrancar sin contraseña.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?pon POSTGRES_PASSWORD en el archivo .env}
    # Solo desde esta máquina (127.0.0.1): sin eso, el puerto queda abierto a toda la red.
    ports:
      - "127.0.0.1:5432:5432"
    # Los datos viven en un volumen: sobreviven a docker compose down y a cambiar de imagen.
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "healthy" cuando pg_isready dice que acepta conexiones; up --wait espera a eso.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bashkit"]
      interval: 2s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
