<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" font-family="Inter, system-ui, -apple-system, sans-serif">
  <title>La receta cut, sort, uniq -c, sort -rn y head sobre un access log de seis líneas, con lo que sale de cada comando</title>
  <rect width="1000" height="380" fill="#0d1117"/>
  <text x="500" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">¿Qué IP hace más peticiones? Lo que sale de cada pieza</text>
  <rect x="20" y="64" width="230" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="135" y="92" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle">access.log</text>
  <rect x="20" y="124" width="230" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="32" y="150" fill="#79c0ff" font-size="13">203.0.113.7 - - GET /</text>
  <text x="32" y="176" fill="#79c0ff" font-size="13">10.0.0.5 - - GET /login</text>
  <text x="32" y="202" fill="#79c0ff" font-size="13">203.0.113.7 - - GET /admin</text>
  <text x="32" y="228" fill="#79c0ff" font-size="13">192.0.2.15 - - GET /</text>
  <text x="32" y="254" fill="#79c0ff" font-size="13">203.0.113.7 - - GET /login</text>
  <text x="32" y="280" fill="#79c0ff" font-size="13">10.0.0.5 - - GET /</text>
  <text x="135" y="330" fill="#8b949e" font-size="13" text-anchor="middle">líneas completas</text>
  <rect x="270" y="64" width="135" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="337" y="92" fill="#f78166" font-size="15" font-weight="600" text-anchor="middle">cut -d' ' -f1</text>
  <rect x="270" y="124" width="135" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="282" y="150" fill="#79c0ff" font-size="13">203.0.113.7</text>
  <text x="282" y="176" fill="#79c0ff" font-size="13">10.0.0.5</text>
  <text x="282" y="202" fill="#79c0ff" font-size="13">203.0.113.7</text>
  <text x="282" y="228" fill="#79c0ff" font-size="13">192.0.2.15</text>
  <text x="282" y="254" fill="#79c0ff" font-size="13">203.0.113.7</text>
  <text x="282" y="280" fill="#79c0ff" font-size="13">10.0.0.5</text>
  <text x="337" y="330" fill="#8b949e" font-size="13" text-anchor="middle">solo el campo 1</text>
  <text x="262" y="92" fill="#8b949e" font-size="18" font-weight="600" text-anchor="middle">|</text>
  <rect x="420" y="64" width="135" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="487" y="92" fill="#f78166" font-size="15" font-weight="600" text-anchor="middle">sort</text>
  <rect x="420" y="124" width="135" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="432" y="150" fill="#79c0ff" font-size="13">10.0.0.5</text>
  <text x="432" y="176" fill="#79c0ff" font-size="13">10.0.0.5</text>
  <text x="432" y="202" fill="#79c0ff" font-size="13">192.0.2.15</text>
  <text x="432" y="228" fill="#79c0ff" font-size="13">203.0.113.7</text>
  <text x="432" y="254" fill="#79c0ff" font-size="13">203.0.113.7</text>
  <text x="432" y="280" fill="#79c0ff" font-size="13">203.0.113.7</text>
  <text x="487" y="330" fill="#8b949e" font-size="13" text-anchor="middle">iguales, seguidas</text>
  <text x="412" y="92" fill="#8b949e" font-size="18" font-weight="600" text-anchor="middle">|</text>
  <rect x="570" y="64" width="135" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="637" y="92" fill="#f78166" font-size="15" font-weight="600" text-anchor="middle">uniq -c</text>
  <rect x="570" y="124" width="135" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="582" y="150" fill="#79c0ff" font-size="13">2 10.0.0.5</text>
  <text x="582" y="176" fill="#79c0ff" font-size="13">1 192.0.2.15</text>
  <text x="582" y="202" fill="#79c0ff" font-size="13">3 203.0.113.7</text>
  <text x="637" y="330" fill="#8b949e" font-size="13" text-anchor="middle">cuántas de cada</text>
  <text x="562" y="92" fill="#8b949e" font-size="18" font-weight="600" text-anchor="middle">|</text>
  <rect x="720" y="64" width="135" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="787" y="92" fill="#f78166" font-size="15" font-weight="600" text-anchor="middle">sort -rn</text>
  <rect x="720" y="124" width="135" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="732" y="150" fill="#79c0ff" font-size="13">3 203.0.113.7</text>
  <text x="732" y="176" fill="#79c0ff" font-size="13">2 10.0.0.5</text>
  <text x="732" y="202" fill="#79c0ff" font-size="13">1 192.0.2.15</text>
  <text x="787" y="330" fill="#8b949e" font-size="13" text-anchor="middle">de más a menos</text>
  <text x="712" y="92" fill="#8b949e" font-size="18" font-weight="600" text-anchor="middle">|</text>
  <rect x="870" y="64" width="115" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="927" y="92" fill="#f78166" font-size="15" font-weight="600" text-anchor="middle">head -2</text>
  <rect x="870" y="124" width="115" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="882" y="150" fill="#79c0ff" font-size="13">3 203.0.113.7</text>
  <text x="882" y="176" fill="#79c0ff" font-size="13">2 10.0.0.5</text>
  <text x="927" y="330" fill="#8b949e" font-size="13" text-anchor="middle">las 2 primeras</text>
  <text x="862" y="92" fill="#8b949e" font-size="18" font-weight="600" text-anchor="middle">|</text>
  <text x="500" y="362" fill="#8b949e" font-size="13" text-anchor="middle">sin el primer sort, uniq -c vería las IP separadas y contaría 1, 1, 1, 1, 1, 1</text>
</svg>
